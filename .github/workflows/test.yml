# Self-checks: the Herdr desktop app mods (pure functions, no Herdr needed) and the Claude scripts (fake gh).
name: test
on:
  push:
  pull_request:
jobs:
  herdr-mods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26 # same as .config/mise/config.toml
      - run: node --test .config/herdr-app/mods/*/*.test.mjs
  claude-scripts:
    runs-on: ubuntu-latest # has bash and jq
    steps:
      - uses: actions/checkout@v7
      - run: for t in .claude/scripts/*.test .claude/hooks/*.test .claude/skills/pr-review/scripts/*_test.sh .local/bin/claude.test .local/bin/wt-prune.test .local/bin/launchd-status.test .claude/statusline-command.test; do bash "$t" || exit 1; done
